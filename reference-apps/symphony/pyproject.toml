[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "symphony-temper"
version = "0.1.0"
description = "Minimal Symphony-on-Temper orchestrator (Dark Factory for Helix)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
symphony = "symphony.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["symphony*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
