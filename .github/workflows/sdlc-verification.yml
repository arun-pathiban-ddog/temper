# Fork contributions are inspected as data; never execute their code in this workflow.
# The verification gate: proof of implementation (SDLC loop: the "test + verify" stage). Vendor into a repo as
# .github/workflows/sdlc-verification.yml. The agent writes .proof/proof.json plus its
# evidence (transcripts, screenshots) into .proof/ in the workspace - never
# committed. This workflow validates the proof, renders the report, deploys it
# to an access-controlled Vercel preview, and posts one PR comment (updated in
# place) with the inline summary + the private report link.
#
# Required repo/org secrets (Rita provisions once in Vercel + GitHub):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID  (a dedicated "proof-reports"
#   Vercel project with Deployment Protection / Vercel Authentication ON, so
#   preview URLs are team-only). If the secrets are absent the gate still
#   validates and posts the summary; the report falls back to the CI artifact.
name: sdlc-verification
on:
  # A PR comment does NOT re-trigger pull_request workflows, so a proof record
  # posted after this gate ran red would leave the check stale. Two re-trigger
  # paths exist: post-proof-record.sh ends by re-running the latest completed
  # sdlc-verification run for the head (the normal path), and adding any label
  # fires the `labeled` type as a manual fallback.
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, edited]
permissions:
  contents: read
  pull-requests: write
  checks: write
jobs:
  proof:
    permissions:
      contents: read
      pull-requests: write
      checks: write
    runs-on: ubuntu-latest
    # The `secrets` context is NOT allowed in step-level `if:`; hoist the presence
    # test into job-level env (which may read secrets) and gate the step on env.
    env:
      HAS_VERCEL: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
    steps:
      - name: Start the gate on the contributor commit
        id: contributor_check
        uses: actions/github-script@v7
        with:
          script: |
            const {data: check} = await github.rest.checks.create({
              ...context.repo, name: 'proof',
              head_sha: context.payload.pull_request.head.sha,
              status: 'in_progress',
              details_url: context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            });
            core.setOutput('check_id', check.id);
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Fetch contribution objects without checking out its code
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUM" =~ ^[0-9]+$ && "$PR_HEAD" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "refs/pull/${PR_NUM}/head"
          test "$(git rev-parse FETCH_HEAD)" = "$PR_HEAD" || {
            echo "::error::PR changed during this run; use the latest event"; exit 1;
          }
      - name: Fetch the proof toolkit from stack
        env:
          STACK_TOKEN: ${{ secrets.STACK_TOKEN }}
        run: |
          if [ -z "${STACK_TOKEN:-}" ]; then
            echo "::error::STACK_TOKEN is missing from the trusted base-repository gate configuration"; exit 1; fi
          git clone --depth 1 https://x-access-token:${STACK_TOKEN}@github.com/arni-labs/stack /tmp/stack || {
            echo "::error::cannot reach arni-labs/stack for the proof toolkit"; exit 1; }
          python3 -m pip install --quiet jsonschema || true
      - name: Does this change need proof?
        id: scope
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # proof is for behavior changes. A PR touching only docs/workflows/agent
          # config has nothing to drive - it passes without proof. A FAILED diff is
          # NOT "no code changed": it fails the gate loudly instead of skipping proof.
          if ! git diff --name-only "${PR_BASE}...${PR_HEAD}" > /tmp/changed.txt; then
            echo "::error::git diff ${PR_BASE}...${PR_HEAD} failed - cannot scope this PR, refusing to skip proof"
            exit 1
          fi
          # NOTE: no blanket .md exclusion - in these repos agent instructions and
          # skills (os-apps/**/SKILL.md, APP.md) are runtime behavior. Only genuinely
          # inert paths are excluded.
          CODE=$(grep -vE '^(\.github/workflows/|docs/|\.claude/|\.cursor/|README)' /tmp/changed.txt || true)
          if [ -z "$CODE" ]; then echo "needs=false" >> "$GITHUB_OUTPUT"; echo "No app code changed - proof not required."; else echo "needs=true" >> "$GITHUB_OUTPUT"; fi
      - name: Get the proof record from the PR (not committed)
        if: steps.scope.outputs.needs == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p .proof
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          n=os.environ["PR_NUM"]; head=os.environ["PR_HEAD"]
          repo=os.environ.get("GITHUB_REPOSITORY","")
          body=subprocess.run(["gh","api",f"repos/{repo}/issues/{n}/comments",
                              "--paginate","-q",".[].body"],capture_output=True,text=True).stdout
          import base64
          rec=None
          def _consider(txt):
              global rec
              try:
                  cand=json.loads(base64.b64decode(txt).decode())
              except Exception:
                  return
              if cand.get("commit")==head: rec=cand
          for m in re.finditer(r"<!--\s*sdlc-proof-record-b64\s*([A-Za-z0-9+/=\s]+?)\s*-->", body):
              _consider(m.group(1).strip())
          if not rec:
              print(f"::error::no proof record for head {head} on the PR - run the verify skill against the current head and post it (bash stack/proof/post-proof-record.sh)")
              sys.exit(1)
          json.dump(rec, open(".proof/proof.json","w"))
          print("proof record for the current head loaded from the PR")
          PY
      - name: Validate proof (the gate)
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        if: steps.scope.outputs.needs == 'true'
        run: |
          # evidence must be URLs: CI has no local evidence files (never committed),
          # so a record citing local paths is unverifiable here
          python3 /tmp/stack/proof/validate.py .proof/proof.json --require-url-evidence --features-commit "$PR_HEAD"
      - name: Render report + summary
        if: steps.scope.outputs.needs == 'true'
        run: |
          python3 /tmp/stack/proof/render.py .proof/proof.json --out .proof/index.html --assets-dir .proof > .proof/summary.md
          cat .proof/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy report to access-controlled Vercel
        id: vercel
        # only when there is a report (scope needs proof) and Vercel is configured
        if: ${{ steps.scope.outputs.needs == 'true' && env.HAS_VERCEL == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@latest >/dev/null 2>&1
          URL=$(vercel deploy .proof --yes --token "$VERCEL_TOKEN" 2>/dev/null | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.needs == 'true'
        with:
          name: proof-report
          path: .proof/index.html
      - name: Post PR comment (updated in place)
        if: steps.scope.outputs.needs == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('.proof/summary.md','utf8');
            const url = '${{ steps.vercel.outputs.url }}';
            const link = url
              ? `\n\n**[Open the full report (team-only)](${url})**`
              : `\n\n_Full report: the \`proof-report\` artifact on this run (Vercel secrets not set)._`;
            const body = "<!-- sdlc-verification -->\n" + summary + link;
            const {data: comments} = await github.rest.issues.listComments({...context.repo, issue_number: context.issue.number});
            const mine = comments.find(c => c.body.includes('<!-- sdlc-verification -->'));
            if (mine) await github.rest.issues.updateComment({...context.repo, comment_id: mine.id, body});
            else await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
      - name: Report this gate on the contributor commit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const {data: current} = await github.rest.pulls.get({
              ...context.repo, pull_number: pr.number
            });
            if (current.head.sha !== pr.head.sha) {
              core.notice('PR head changed; this result cannot authorize the newer commit.');
              return;
            }
            const result = '${{ job.status }}';
            const checkId = Number('${{ steps.contributor_check.outputs.check_id }}');
            const report = {
              ...context.repo, name: 'proof', head_sha: pr.head.sha,
              status: 'completed',
              conclusion: result === 'success' ? 'success' :
                result === 'cancelled' ? 'cancelled' : 'failure',
              details_url: context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              output: {title: 'proof', summary: 'Validated using trusted base-repository gate code.'}
            };
            if (checkId) {
              const {head_sha, ...update} = report;
              await github.rest.checks.update({...update, check_run_id: checkId});
            } else {
              await github.rest.checks.create(report);
            }
